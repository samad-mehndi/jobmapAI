services:
  db:
    build:
      context: .
      dockerfile: Dockerfile.db
    container_name: jobmap_db
    environment:
      POSTGRES_USER: jobmap
      POSTGRES_PASSWORD: jobmap_dev
      POSTGRES_DB: jobmap
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobmap"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobmap_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: